# Reference copy of what we changed on the Hermes `support` profile, on top of a blank
# profile created with:
#   hermes profile create support --no-skills --no-alias --description "..."
# The real file lives at /root/.hermes/profiles/support/config.yaml on the droplet.
# This copy is for history and review; it contains no secrets (the profile's API key
# lives in its own .env on the droplet and is never committed).
#
# Safety model (changed 2026-10-17): the bot has NO SHELL. The terminal toolset is
# disabled, so the only things it can do are the five pokectl tools below and the
# kanban board tools. That replaces the earlier approach of an allowlist plus 89 deny
# rules, which was only policy: Hermes allows most commands by default and a shell
# glob could dodge a path rule. Those rules are still in the live file but unused; they
# are in git history (commit 7b8c1cb) if the terminal is ever turned back on.

model:
  provider: anthropic
  default: claude-haiku-4-5

# Built-in toolsets enabled for this profile: kanban only (to finish its own task).
# Set with `hermes -p support tools disable terminal` after enabling kanban.
platform_toolsets:
  cli:
    - kanban

# Added with:
#   hermes -p support mcp add pokectl --command /usr/local/bin/pokectl --args mcp --role support
# Tools served: policy, ticket_get, ticket_recent, ticket_reply, ticket_classify.
mcp_servers:
  pokectl:
    command: /usr/local/bin/pokectl
    args:
      - mcp
      - --role
      - support
    enabled: true

# Dispatcher settings live on the default profile (the gateway host), not here:
#   kanban.max_in_progress: 1
#   kanban.auto_decompose: false
#   kanban.failure_limit: 2
# Per-ticket tasks are created by `pokectl sync` with --max-runtime 10m --max-retries 1.
