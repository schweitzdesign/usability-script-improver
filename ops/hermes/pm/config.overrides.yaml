# Reference copy of what we change on the Hermes `pm` profile, on top of a blank profile created with:
#   hermes profile create pm --no-skills --no-alias --description "..."
# The real file lives at /root/.hermes/profiles/pm/config.yaml on the droplet. This copy is for
# history and review; it contains no secrets (the profile's API key lives in its own .env on the
# droplet and is never committed).
#
# Same safety model as Support: NO SHELL. The terminal toolset is disabled, so the only things
# this bot can do are the pokectl tools below and the kanban board tools.

model:
  provider: anthropic
  default: claude-sonnet-5

# Built-in toolsets enabled for this profile: kanban only (to finish its own task).
# Set with `hermes -p pm tools disable terminal` after enabling kanban.
platform_toolsets:
  cli:
    - kanban

# Added with:
#   hermes -p pm mcp add pokectl --command /usr/local/bin/pokectl --args mcp --role pm
# Tools served: ticket_get, backlog_list, backlog_get, backlog_create, backlog_attach,
# backlog_update, request_assessment, request_followup, budget_get, submit_recommendation.
mcp_servers:
  pokectl:
    command: /usr/local/bin/pokectl
    args:
      - mcp
      - --role
      - pm
    enabled: true

# Cost lever, measured 2026-10-17 on throwaway tickets: with Hermes' default lazy tool loading the
# PM spent about $0.19 on a new item and $0.15 on a duplicate, because every MCP call needed extra
# tool_search, tool_describe, and tool_call steps and each step re-read the whole prompt. Turning
# it off loads the 8 PM tools directly: about $0.13 and $0.08, roughly 39 percent less, with the
# same quality of output. Set with: hermes -p pm config set tools.tool_search.enabled off
tools:
  tool_search:
    enabled: "off"
