name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/ship-guard.test.mjs
      - run: npm run lint
      # Next generates PageProps and LayoutProps; a fresh checkout needs them before tsc can pass.
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
